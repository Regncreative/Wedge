[package]
name = "wedge"
version = "2.1.0"
description = "A file shelf on the edge of your screen"
authors = ["Regncreative"]
license = "MIT"
repository = "https://github.com/Regncreative/Wedge"
edition = "2021"
rust-version = "1.90"

[lib]
name = "stash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tokio = { version = "1", features = ["time", "fs", "sync"] }
base64 = "0.22"
png = "0.18"
sys-locale = "0.3"
zip = { version = "4", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
notify = "8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tiny_http = "0.12"
webp = { version = "0.3", default-features = false }
trash = "5"

[target.'cfg(windows)'.dependencies]
# #[implement] (dragout.rs) refers to windows_core by name.
windows-core = "0.100"
winreg = "0.56"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemServices",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

[features]
# The Microsoft Store build, packaged as MSIX (scripts/build-msix.mjs).
store = ["windows/ApplicationModel", "windows/Storage_Search"]

[dev-dependencies]
tempfile = "3"
minisign-verify = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
