<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Wedge: three shelf tabs coming out of the right edge, the middle one pulled further. -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2C3A"/>
      <stop offset="1" stop-color="#14151C"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <rect x="23" y="12" width="51" height="11" rx="5.5" fill="#8D97FF"/>
    <circle cx="29" cy="17.5" r="2.3" fill="#14151C" fill-opacity=".26"/>
    <rect x="11" y="26.5" width="63" height="11" rx="5.5" fill="#FF7FAC"/>
    <circle cx="17" cy="32" r="2.3" fill="#14151C" fill-opacity=".26"/>
    <rect x="27" y="41" width="47" height="11" rx="5.5" fill="#F6BB45"/>
    <circle cx="33" cy="46.5" r="2.3" fill="#14151C" fill-opacity=".26"/>
  </g>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
