name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Stash is a Windows app: test and package on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Lint (ESLint + Clippy)
        run: npm run lint

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: npm run typecheck

      - name: Unit tests (frontend)
        run: npm run test:coverage

      - name: Unit tests (Rust)
        run: npm run test:rust

      # Debug build with the frontend embedded, plus an installer, without
      # update signing (that key only exists in the Release workflow).
      - name: Build app and installer
        run: npx tauri build --debug --config src-tauri/tauri.ci.conf.json

      - name: WebView2 runtime on the runner
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $found = $keys | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if ($found) { "WebView2 runtime $($found.pv)" } else { 'WebView2 runtime: not found' }

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
