name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Wedge is a Windows app: test and package on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Lint (ESLint + Clippy)
        run: npm run lint

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # The Microsoft Store build and its File Explorer extension (msix/).
      - name: Clippy (Store build)
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features store -- -D warnings
          cargo clippy --manifest-path msix/shell-ext/Cargo.toml -- -D warnings
          cargo fmt --manifest-path msix/shell-ext/Cargo.toml --check

      - run: npm run typecheck

      - name: Unit tests (frontend)
        run: npm run test:coverage

      - name: Unit tests (Rust)
        run: npm run test:rust

      # Debug build with the frontend embedded, plus an installer, without
      # update signing (that key only exists in the Release workflow).
      - name: Build app and installer
        run: npx tauri build --debug --config src-tauri/tauri.ci.conf.json

      # Runner processes are elevated, and an elevated app ignores the
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS the tests set. A machine-wide
      # policy still applies: port 0 lets WebView2 pick a free port, which the
      # tests read from its DevToolsActivePort file.
      - name: Open WebView2's DevTools port for the tests
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'wedge.exe' -Value '--remote-debugging-port=0' -PropertyType String -Force | Out-Null

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
