name: Release

# Push a version tag (npm version minor && git push --follow-tags) to build
# the signed installer and upload it to a *draft* GitHub Release. Nothing
# reaches users until a maintainer reviews the draft and publishes it.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if none)

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rust

      # Code signing (Authenticode): once a certificate is available
      # (SignPath / Certum), sign wedge.exe and the installer here.

      - name: Build signed installer
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate installer
        run: |
          setup=$(realpath src-tauri/target/release/bundle/nsis/*-setup.exe)
          echo "SETUP=$setup" >> "$GITHUB_ENV"

      - name: Verify update signature against the shipped public key
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored signature
        env:
          STASH_INSTALLER: ${{ env.SETUP }}

      # The runner is elevated, so the app ignores the tests' WEBVIEW2_*
      # variable; see the same step in ci.yml.
      - name: Open WebView2's DevTools port for the tests
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'wedge.exe' -Value '--remote-debugging-port=0' -PropertyType String -Force | Out-Null

      - name: End-to-end tests against the release build
        run: npm run test:e2e
        env:
          STASH_EXE: src-tauri/target/release/wedge.exe

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found && index($0, "[") == 1 && index($0, "]: http") > 0 { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION"
            echo "Wedge $VERSION" > notes.md
          fi

      - name: Update manifests
        run: |
          mkdir manifests
          node scripts/release-manifests.mjs "$SETUP" "$VERSION" "$GITHUB_REF_NAME" notes.md manifests
          # Pre-releases must never reach 1.x installs (they only read
          # releases/latest), but keep the file out of beta drafts entirely.
          if [[ "$VERSION" == *-* ]]; then rm manifests/latest.yml; fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--draft --title "Wedge $VERSION" --notes-file notes.md)
          # Stable users only see non-pre-releases.
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            "$SETUP" "$SETUP.sig" manifests/*

      # The Microsoft Store package, uploaded by hand in Partner Center (the
      # Store signs it). The identity is in the repository's variables.
      - name: Microsoft Store package (MSIX)
        run: node scripts/build-msix.mjs
        env:
          MSIX_NAME: ${{ vars.MSIX_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}

      - name: Upload the MSIX
        uses: actions/upload-artifact@v4
        with:
          name: wedge-msix
          path: src-tauri/target/store/*.msix
          retention-days: 30
