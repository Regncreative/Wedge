name: Rollout

# Staged rollout for a published release. Each install computes a stable
# bucket 0–99 and only updates when bucket < stagingPercentage. Use e.g.
# 10 → 50 → 100, or 0 to halt a bad release. 100 removes the limit.
# Applies to both feeds: latest.json (2.x) and latest.yml (1.x upgrading).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v2.0.0)
        required: true
      percentage:
        description: Share of users who get the update (0-100)
        required: true
        default: '10'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          PCT: ${{ inputs.percentage }}
        run: |
          if ! [[ "$PCT" =~ ^[0-9]+$ ]] || [ "$PCT" -gt 100 ]; then
            echo "::error::percentage must be an integer between 0 and 100"
            exit 1
          fi

      - name: Set stagingPercentage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PCT: ${{ inputs.percentage }}
        run: |
          mkdir feed
          gh release download "$TAG" --pattern 'latest.*' --dir feed --repo "$GITHUB_REPOSITORY"
          if [ -f feed/latest.json ]; then
            if [ "$PCT" -lt 100 ]; then
              jq --argjson p "$PCT" '.stagingPercentage = $p' feed/latest.json > feed/tmp && mv feed/tmp feed/latest.json
            else
              jq 'del(.stagingPercentage)' feed/latest.json > feed/tmp && mv feed/tmp feed/latest.json
            fi
          fi
          if [ -f feed/latest.yml ]; then
            sed -i '/^stagingPercentage:/d' feed/latest.yml
            if [ "$PCT" -lt 100 ]; then echo "stagingPercentage: $PCT" >> feed/latest.yml; fi
          fi
          head -50 feed/*
          gh release upload "$TAG" feed/latest.* --clobber --repo "$GITHUB_REPOSITORY"

          # Keep the beta feed in step when it points at this release.
          if gh release download channel-beta --pattern latest.json --dir beta --repo "$GITHUB_REPOSITORY" 2>/dev/null \
             && [ "$(jq -r .version beta/latest.json)" = "$(jq -r .version feed/latest.json)" ]; then
            cp feed/latest.json beta/latest.json
            gh release upload channel-beta beta/latest.json --clobber --repo "$GITHUB_REPOSITORY"
          fi
