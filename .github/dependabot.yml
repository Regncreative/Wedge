version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # tailwind-merge 3 is for Tailwind 4; Wedge is on Tailwind 3.
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) waits until the tooling around it supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Moves with the windows crate (it must match the windows-core that crate
      # uses, for #[implement]), as one change by hand.
      - dependency-name: "windows-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # zip changes its API often; Wedge moved to 4 in October 2026.
      - dependency-name: "zip"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
